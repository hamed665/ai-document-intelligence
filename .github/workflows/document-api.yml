name: Document API
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run ruff check service tests-service
      - run: uvx black==23.7.0 --check service tests-service
      - run: uv run pytest tests-service
      - run: uv run pip-audit --path .venv/lib/python3.12/site-packages
