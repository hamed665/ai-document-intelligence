services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      DOCUMENT_API_TOKEN: ${DOCUMENT_API_TOKEN:?Generate a fresh local token}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 768m
    cpus: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [isolated]
networks:
  isolated:
    internal: true
