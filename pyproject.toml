[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-document-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["markitdown[pdf,docx,xlsx]", "fastapi", "uvicorn", "python-multipart"]
[dependency-groups]
dev = ["pytest", "httpx", "ruff", "pip-audit"]
[tool.uv.sources]
markitdown = { path = "packages/markitdown", editable = true }
[tool.setuptools.packages.find]
include = ["service*"]
[tool.ruff]
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I"]
